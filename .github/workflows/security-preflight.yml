# Fails any push or PR that carries the config-injection worm's footprints
# (see docs/security/2026-09-25-polinrider-incident.md). Nothing from the
# repo is installed or executed: the check only reads files.
name: security-preflight

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/security/preflight.mjs
